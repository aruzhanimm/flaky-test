name: Verify research artifact

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - name: Restore and verify snapshot bytes
        if: hashFiles('artifacts/research-snapshot.tar.xz') != ''
        run: python scripts/restore_artifacts.py
      - name: Install recorded analysis dependencies
        run: python -m pip install -r requirements-analysis.txt
      - name: Run unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Recalculate reference results
        if: hashFiles('data/processed/corpus.jsonl') != ''
        run: |
          python scripts/validate_results.py main_v3 --repeat main_v3_repeat
          python scripts/validate_results.py main_v3_three_labels
          python scripts/validate_extension_v4.py extension_v4
      - name: Fit and check the held-out ActiveMQ demonstration
        if: hashFiles('data/processed/corpus.jsonl') != ''
        run: python scripts/defence_demo.py
